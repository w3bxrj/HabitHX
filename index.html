<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Hunter</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1><i class="fas fa-chart-line"></i>HabitHX</h1>

            <!-- Theme opt  -->

            <div class="theme-switcher">
                <button id="themeToggle" class="theme-btn">
                    <i class="fas fa-moon"></i> Dark Mode
                </button>
            </div>
    </div>

    <p class="date" id="currentDate">Today's Date</p>
    </header>
    <!-- Input ka kaam yhi se hoga na? -->
    <section class="input-section">
        <div class="input">
            <input type="text" id="habitName" placeholder="Enter Habit You To Adapt !!!">
            <button id="addBtn"><i class="fas fa-plus"></i> Add Habit</button>
        </div>

    </section>

    <section class="progress-section">
        <div class="progressBar">
            <p id="progressInfo"><i class="fas fa-chart-pie"></i> No habits added yet</p>
        </div>
    </section>

    <!-- Habit List saar ghuma rhi hai -->
    <section class="habits-section">
        <h3 style="color: #444; margin-bottom: 15px; font-size: 1.2rem;">
            <i class="fas fa-list-check"></i> Your Habits
        </h3>

        <ul id="habitList">
            <!-- Habits list yha se suru krunga -->
        </ul>

        <!-- Khali Paan 😴 -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="fas fa-clipboard-list"></i>
            <p>No habits added yet. Start building good habits now!</p>
        </div>
    </section>

    </div>

    <script src="script.js"></script>
</body>

</html>
